services:
  # ==============================================================
  # PostgreSQL - Banco de Dados Principal
  # ==============================================================
  postgres:
    image: postgres:16-alpine
    container_name: livre-postgres
    restart: unless-stopped
    networks:
      - livre_backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./backups:/backups:rw
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-livre_admin}
      POSTGRES_PASSWORD: ${DB_SUPERPASS:?DB_SUPERPASS is required}
      POSTGRES_DB: livre_backend
    ports:
      - "127.0.0.1:5432:5432"   # Apenas localhost (ferramentas admin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-livre_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================
  # PostgREST - API REST Automática
  # ==============================================================
  postgrest:
    image: postgrest/postgrest:v12
    container_name: livre-postgrest
    restart: unless-stopped
    networks:
      - livre_backend_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${PG_AUTHUSER}:${PG_AUTHPASS}@postgres:5432/livre_backend
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PUBLIC_URL:-http://localhost}/api/rest
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================
  # Auth Service - Autenticação (Node.js + TypeScript)
  # ==============================================================
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: livre-auth
    restart: unless-stopped
    networks:
      - livre_backend_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgres://${PG_AUTHUSER}:${PG_AUTHPASS}@postgres:5432/livre_backend
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================
  # Admin API - API Administrativa (Node.js + TypeScript)
  # ==============================================================
  admin-api:
    build:
      context: ./services/admin-api
      dockerfile: Dockerfile
    container_name: livre-admin-api
    restart: unless-stopped
    networks:
      - livre_backend_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgres://${PG_ADMINUSER}:${PG_ADMINPASS}@postgres:5432/livre_backend
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================
  # Visual DB - Editor Visual de Banco de Dados (Node.js + TypeScript)
  # ==============================================================
  visual-db:
    build:
      context: ./services/visual-db
      dockerfile: Dockerfile
    container_name: livre-visual-db
    restart: unless-stopped
    networks:
      - livre_backend_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3004
      NODE_ENV: production
      DATABASE_URL: postgres://${PG_ADMINUSER}:${PG_ADMINPASS}@postgres:5432/livre_backend
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      POSTGREST_URL: http://postgrest:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================
  # Admin Panel - Painel Administrativo (Next.js)
  # ==============================================================
  admin-panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    container_name: livre-admin-panel
    restart: unless-stopped
    networks:
      - livre_backend_net
    depends_on:
      - auth-service
      - admin-api
      - visual-db
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost}/admin/api
      NEXT_PUBLIC_AUTH_URL: ${PUBLIC_URL:-http://localhost}/auth
      NEXT_PUBLIC_VISUAL_DB_URL: ${PUBLIC_URL:-http://localhost}/admin/visual-db
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres_data:
    driver: local
  backups:
    driver: local

# ==============================================================
# Redes
# ==============================================================
networks:
  livre_backend_net:
    driver: bridge
    internal: true
