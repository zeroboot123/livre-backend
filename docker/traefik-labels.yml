# ==============================================================
# LIVRE BACKEND - Configuração para Traefik (EasyPanel)
# ==============================================================
# Este arquivo contém as labels Traefik para integração
# com o proxy reverso gerenciado pelo EasyPanel.
#
# Adicione estas labels aos serviços no docker-compose.yml
# quando for fazer deploy na VPS com EasyPanel.
# ==============================================================

# Labels a serem adicionadas em cada serviço:

# ─── Para o serviço auth-service ───
# labels:
#   - "traefik.enable=true"
#   - "traefik.http.routers.livre-auth.rule=Host(`api.livrebackend.com.br`) && PathPrefix(`/auth`)"
#   - "traefik.http.routers.livre-auth.entrypoints=websecure"
#   - "traefik.http.routers.livre-auth.tls.certresolver=letsencrypt"
#   - "traefik.http.services.livre-auth.loadbalancer.server.port=3001"
#   - "traefik.http.middlewares.livre-auth-strip.stripprefix.prefixes=/auth"
#   - "traefik.http.routers.livre-auth.middlewares=livre-auth-strip"

